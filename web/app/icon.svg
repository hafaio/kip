<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The Terra wordmark tile: the same terracotta-to-amber gradient square and
       white "k" as components/wordmark.tsx. The letter is drawn as strokes rather
       than set as text, so it renders identically without Plus Jakarta Sans. -->
  <defs>
    <linearGradient id="terra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2582f" />
      <stop offset="0.55" stop-color="#ee8438" />
      <stop offset="1" stop-color="#f6b24a" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#terra)" />
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 14 V50" />
    <path d="M42 25 L20 40" />
    <path d="M28 34.5 L44 50" />
  </g>
</svg>
