name: CI

# Build/test gate. Runs on every push to main and every PR, and is reused by the
# deploy workflow (workflow_call) so a release can't publish over a red build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The Firestore rules emulator (test:rules) runs on the JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - run: bun install --frozen-lockfile

      # `bun lint` typechecks the functions package too, so its types have to be
      # installed — it's a separate package on the Node runtime.
      - run: npm ci
        working-directory: functions

      - run: bun lint

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - run: bun test tests/drift.test.ts tests/notifications.test.ts

      - run: bun run test:rules
