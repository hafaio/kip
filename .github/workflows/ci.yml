name: build

# Build/test gate. Runs on every push to main and every PR, and is reused by the
# deploy workflow (workflow_call) so a release can't publish over a red build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The Firestore rules emulator (test:rules) runs on the JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - run: bun install --frozen-lockfile

      # `bun lint` typechecks the functions package too, so its types have to be
      # installed — it's a separate package on the Node runtime.
      - run: npm ci
        working-directory: functions

      - run: bun lint

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # The script, never a copy of its file list: that copy silently drifted.
      - run: bun run test

      - run: bun run test:rules

  automerge:
    needs: [check]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # dependabot-triggered runs get a read-only token unless a job asks for more
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
