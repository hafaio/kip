name: deploy web

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Before the site, so a release can never publish a frontend expecting rules or
  # triggers that aren't live yet. Auth is Workload Identity Federation, so no key
  # is stored and only this repo's OIDC tokens are accepted.
  firebase:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: google-github-actions/auth@v3
        with:
          project_id: hafaio-kip-dev
          workload_identity_provider: projects/230290747847/locations/global/workloadIdentityPools/github/providers/kip-deploy
          service_account: kip-deployer@hafaio-kip-dev.iam.gserviceaccount.com

      - run: npm ci
        working-directory: functions

      - run: npm install -g firebase-tools

      # Unconditional: working out what changed is more trouble than redeploying.
      # --force answers the two prompts a non-interactive deploy can't: the retry policy
      # on the teardown and text-check triggers, and deleting a function that has left
      # the source. The second is the one to remember when renaming one.
      - run: firebase deploy --only firestore:rules,functions --project hafaio-kip-dev --non-interactive --force

  build:
    needs: firebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Turns Pages on if it isn't already, so the first release doesn't fail on
      # an unclicked setting. Needs the repo to be Pages-eligible: public, on a
      # free org plan.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
