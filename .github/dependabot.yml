version: 2
updates:
  # `npm` here leaves bun.lock stale, so every PR failed --frozen-lockfile.
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: monthly
    groups:
      functions:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
